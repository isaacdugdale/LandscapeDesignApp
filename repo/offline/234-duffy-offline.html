document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

oll\" ref=\"{{ chatRef }}\" style=\"flex:1;min-height:0;padding:18px 24px\">\n              <div style=\"max-width:680px;display:flex;flex-direction:column;gap:12px\">\n                <sc-for list=\"{{ chat }}\" as=\"m\" hint-placeholder-count=\"2\">\n                  <div style=\"{{ m.wrap }}\">\n                    <div style=\"{{ m.bubble }}\">{{ m.text }}<\u002Fdiv>\n                    <sc-if value=\"{{ m.change }}\" hint-placeholder-val=\"{{ true }}\">\n                      <div style=\"margin-top:8px;border-radius:18px;background:#fff;border:1.5px dashed var(--color-accent-400);padding:12px 14px;display:flex;gap:12px;align-items:center\">\n                        <div style=\"flex:1\">\n                          <div style=\"font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--color-accent-700);margin-bottom:3px\">Suggested change · not applied<\u002Fdiv>\n                          <div style=\"font-size:13px;line-height:1.5\">{{ m.change }}<\u002Fdiv>\n                        <\u002Fdiv>\n                        <div sc-camel-on-click=\"{{ m.addTodo }}\" style=\"flex:0 0 auto;padding:9px 15px;border-radius:999px;background:var(--color-accent);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer\">{{ m.addLabel }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:0 0 auto;padding:12px 24px 18px;border-top:1px solid var(--color-divider)\">\n              <div style=\"display:flex;gap:10px;align-items:center;max-width:760px\">\n                <input value=\"{{ askQ }}\" sc-camel-on-input=\"{{ onAsk }}\" sc-camel-on-key-down=\"{{ onAskKey }}\" placeholder=\"Ask about the site, the plan, the money…\" style=\"flex:1;font:inherit;font-size:14px;padding:13px 18px;border-radius:999px;border:1.5px solid var(--color-neutral-300);background:#fff;outline:none;color:var(--color-text)\">\n                <div sc-camel-on-click=\"{{ send }}\" style=\"padding:13px 22px;border-radius:999px;background:var(--color-accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap\">{{ sendLabel }}<\u002Fdiv>\n                <div sc-camel-on-click=\"{{ handoff }}\" style=\"display:flex;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;border:1.5px solid var(--color-neutral-300);background:#fff;font-size:13.5px;font-weight:600;color:var(--color-neutral-700);cursor:pointer;white-space:nowrap\" style-hover=\"background:var(--color-neutral-200)\">\n                  <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3v12\"><\u002Fpath><path d=\"m17 8-5-5-5 5\"><\u002Fpath><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"><\u002Fpath><\u002Fsvg>\n                  Claude app\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:12px;align-items:center;margin-top:9px;max-width:760px\">\n                <div style=\"flex:1;font-size:11.5px;line-height:1.5;color:var(--color-neutral-600)\">Answers read the survey, the tree plan, the geotechnical report and your current layout. Nothing here moves anything on the plan — changes are suggested, and you apply them yourself.<\u002Fdiv>\n                <div sc-camel-on-click=\"{{ toggleBrief }}\" style=\"flex:0 0 auto;font-size:11.5px;font-weight:600;color:var(--color-accent-700);cursor:pointer\">{{ briefLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"margin-top:10px;display:inline-block;padding:9px 16px;border-radius:999px;background:var(--color-accent-2-100);color:var(--color-accent-2-800);font-size:12.5px;font-weight:600\">{{ toast }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ briefOpen }}\" hint-placeholder-val=\"{{ true }}\">\n                <div class=\"ls-scroll\" style=\"margin-top:10px;max-width:760px;max-height:160px;padding:13px 16px;border-radius:18px;background:var(--color-neutral-100);font:12px/1.6 ui-monospace,Menlo,monospace;color:var(--color-neutral-800);white-space:pre-wrap\">{{ brief }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"ls-scroll\" style=\"flex:0 0 300px;border-left:1px solid var(--color-divider);padding:16px\">\n            <div style=\"font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--color-neutral-600);margin-bottom:9px\">Worth asking<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:7px\">\n              <sc-for list=\"{{ suggestions }}\" as=\"s\" hint-placeholder-count=\"6\">\n                <div sc-camel-on-click=\"{{ s.go }}\" style=\"padding:11px 14px;border-radius:16px;background:var(--color-neutral-100);font-size:12.5px;line-height:1.45;cursor:pointer\" style-hover=\"background:var(--color-neutral-200)\">{{ s.text }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--color-neutral-600);margin:18px 0 9px\">Your list<\u002Fdiv>\n            <sc-if value=\"{{ hasTodos }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;flex-direction:column;gap:6px\">\n                <sc-for list=\"{{ todos }}\" as=\"t\" hint-placeholder-count=\"2\">\n                  <div style=\"padding:10px 13px;border-radius:14px;background:var(--color-accent-100);font-size:12.5px;line-height:1.45;color:var(--color-accent-900);display:flex;gap:9px\">\n                    <div sc-camel-on-click=\"{{ t.done }}\" style=\"flex:0 0 16px;height:16px;border-radius:999px;border:2.75px solid var(--color-accent-500);cursor:pointer;margin-top:1px\"><\u002Fdiv>\n                    <div style=\"flex:1\">{{ t.text }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ noTodos }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"font-size:12.5px;color:var(--color-neutral-600);line-height:1.5\">Nothing yet. When an answer suggests a change, add it here and it stays until you have done it.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ sheetOpen }}\" hint-placeholder-val=\"{{ true }}\">\n    <div sc-camel-on-click=\"{{ closeSheet }}\" style=\"position:absolute;inset:0;z-index:20;background:rgba(46,43,37,.34);display:flex;align-items:center;justify-content:center\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"width:640px;max-height:76%;background:var(--color-bg);border-radius:28px;box-shadow:var(--shadow-lg);padding:22px 24px;display:flex;flex-direction:column\">\n        <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:4px\">\n          <div style=\"font-family:'Caprasimo';font-size:22px\">Schemes<\u002Fdiv>\n          <div style=\"flex:1\"><\u002Fdiv>\n          <div sc-camel-on-click=\"{{ newScheme }}\" style=\"padding:9px 16px;border-radius:999px;background:var(--color-accent);color:#fff;font-size:13px;font-weight:600;cursor:pointer\">New from base plan<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px;color:var(--color-neutral-600);margin-bottom:14px\">Every scheme saves itself as you work. Switching does not lose the one you were in.<\u002Fdiv>\n        <div class=\"ls-scroll\" style=\"flex:1;min-height:0;display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ schemeList }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <div sc-camel-on-click=\"{{ s.open }}\" style=\"{{ s.style }}\">\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"font-size:14.5px;font-weight:600\">{{ s.name }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:var(--color-neutral-600);margin-top:2px\">{{ s.meta }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ s.dup }}\" style=\"padding:7px 13px;border-radius:999px;border:1.5px solid var(--color-neutral-300);background:#fff;font-size:12px;font-weight:600;color:var(--color-neutral-700);cursor:pointer\">Duplicate<\u002Fdiv>\n              <sc-if value=\"{{ s.canDelete }}\" hint-placeholder-val=\"{{ true }}\">\n                <div sc-camel-on-click=\"{{ s.del }}\" style=\"padding:7px 13px;border-radius:999px;border:1.5px solid var(--color-neutral-300);background:#fff;font-size:12px;font-weight:600;color:var(--color-accent-700);cursor:pointer\">Delete<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{ mock }}\" hint-placeholder-val=\"{{ true }}\">\n<div sc-camel-on-click=\"{{ rotate }}\" style=\"display:flex;align-items:center;gap:10px;padding:11px 20px;border-radius:999px;background:#fff;box-shadow:var(--shadow-sm);font-size:13px;font-weight:600;color:var(--color-neutral-700);cursor:pointer\" style-hover=\"background:var(--color-neutral-200)\">\n  <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8\"><\u002Fpath><path d=\"M21 3v5h-5\"><\u002Fpath><\u002Fsvg>{{ rotateLabel }}\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1434,&quot;height&quot;:1092}}\">\nconst SITE={lat:-35.25622,lon:149.15585,tz:10,nb:345.6611};\nconst SNAP=0.05, BUDGET=10000;\nconst COL={\n  paper:'#f9f4ed', ink:'#2e2b25', cont:'#dcd3c4', grid:'#eee7db',\n  exFill:'#dcd3c4', exStroke:'#a19786', prFill:'#eee7db', prStroke:'#82796a',\n  tpz:'#b2622d', srz:'#8c491a', canopy:'#8fa073', water:'#33646b',\n  drive:'#e8e0d0', shade:'#3d472b'\n};\nconst PLANTCOL={tree:'#728157',shrub:'#8fa073',groundcover:'#ccdbb2',grass:'#aebf92',other:'#c0b6a5',veggie:'#aebf92'};\nconst HARDCOL={\n  'Paving / terrace':['#e4dccb','#a19786'],'Outdoor kitchen':['#d8c3a4','#8c491a'],'Gravel path':['#eee7db','#c0b6a5'],\n  'Sunken firepit':['#f6a06b','#8c491a'],'Firepit terrace':['#e4dccb','#a19786'],'Seat / retaining wall':['#c0b6a5','#645c50'],\n  'Raised veg bed':['#ccdbb2','#56633f'],'Shed':['#dcd3c4','#645c50'],'Water tank':['#cfd9d3','#33646b'],\n  'Clothesline':['#dcd3c4','#645c50'],'Mulched bed':['#d8c9ae','#8c491a'],'Planting mound':['#dcc9a8','#8c491a'],\n  'Dichondra lawn':['#ccdbb2','#728157'],'Gym mat':['#eee7db','#82796a'],'Soak pit':['#cfd9d3','#33646b'],'Bench / seat':['#dcd3c4','#645c50']\n};\nconst GROW={groundcover:3,grass:3,veggie:1,shrub:6,other:6,tree:12};\n/* her plant list came out of a spreadsheet, so names arrive half-cased and one is a pasted link */\nfunction DISP(n){ if(!n) return n;\n  if(n.indexOf('http')===0) return 'Anigozanthos, kangaroo paw';\n  const t=n.replace(/\\s+$/,''); return t.charAt(0).toUpperCase()+t.slice(1); }\nconst STAGEDEF={1:{title:'Water and earth',when:'0–3 months',why:'Shaping and anything that decides where water goes. Do it first, then let a wet season test it.'},\n 2:{title:'Living surfaces',when:'3–6 months',why:'Paving, the wall, the kitchen and the lawn platform — the parts you entertain on.'},\n 3:{title:'Planting and sheds',when:'6–12 months',why:'Plants go in last, once the shaping has settled and you know where the shade falls.'}};\nconst SUGG=['Where can I dig without calling the arborist?','Why does the firepit fail the reserve clearance?','What is the sunniest spot left in the back garden?','What does stage one cost if I stop there?','What happens to the lawn if the reserve bank overtops?','How much mulch do I need at 100 mm?','Which plants on my list will not survive a Canberra frost?','Is there anywhere left for a second fruit tree?'];\n\nclass Component extends DCLogic {\n  state={ready:false,fill:false,orient:'landscape',toast:'',briefOpen:false,screen:'plan',mode:'plan',items:[],sel:null,uid:1,years:0,doy:355,hour:13,\n    layers:{contour:true,grid:false,bld:true,tpz:true,srz:true,canopy:true,drain:true,labels:true},\n    layersOpen:false,palTab:'plants',q:'',filt:{must:false,edible:false,local:false,hardy:false},armed:null,\n    schemes:[],schemeId:null,sheetOpen:false,chat:[],askQ:'',busy:false,todos:[],savedAt:null,hud:'Drag to pan · pinch or use + to zoom',\n    issueFilter:'all',sunCache:{}};\n\n  componentDidMount(){ this.hist=[]; this.measure(); this._rz=()=>this.measure(); window.addEventListener('resize',this._rz); this.wait(); }\n  componentWillUnmount(){ window.removeEventListener('resize',this._rz); }\n  /* Shown inside a device frame while it is being designed; opened on the iPad\n     itself (from the home screen) it fills the screen and follows the device. */\n  measure(){\n    const w=window.innerWidth, h=window.innerHeight;\n    let standalone=false;\n    try{ standalone=navigator.standalone===true||window.matchMedia('(display-mode: standalone)').matches; }catch(e){}\n    const touch=(navigator.maxTouchPoints||0)>0;\n    const fill=standalone||(touch&&w<1440&&h<1240);\n    const orient=fill?(w>=h?'landscape':'portrait'):this.state.orient;\n    if(fill!==this.state.fill||orient!==this.state.orient){\n      this.setState({fill:fill,orient:orient},()=>{ if(this.state.ready){ this.view={...this.presetViews().all}; setTimeout(()=>{this.fit();this.draw();},30); } });\n    }\n  }\n  wait(){ if(window.DUFFY){ this.boot(); } else { setTimeout(()=>this.wait(),60); } }\n  boot(){\n    const D=window.DUFFY; this.D=D; this.C=D.TREND; this.YTOP=D.YTOP;\n    this.LIBM={}; D.LIB.forEach(l=>this.LIBM[l[0]]=l);\n    this.PL={}; D.PLANTS.forEach(p=>{ if(!this.PL[p.n]) this.PL[p.n]=p; });\n    this.BLDR=D.BOXH.map(b=>[b[0],b[1],b[2],b[3],b[4]]).concat((D.DRIVE||[]).map(d=>[d[0],d[1],d[2],d[3],d[4]]));\n    this.view={...this.presetViews().all};\n    const st=this.loadStore();\n    if(st){ this.setState({ready:true,...st},()=>{this.fit();this.draw();}); }\n    else{ const items=this.baseItems(); this.setState({ready:true,items:items.items,uid:items.uid,\n        schemes:[{id:'s1',name:'Working scheme',created:Date.now()}],schemeId:'s1',\n        chat:[{who:'app',text:'Ask anything about the block, the rules or your layout. I read the survey, the tree plan, the geotechnical classification and whatever is on the plan right now.'}]},()=>{this.fit();this.draw();this.persist();}); }\n    this.bindCanvas();\n  }\n\n  /* ---------- data helpers ---------- */\n  RL(x,y){const C=this.C;return C[0]+C[1]*x+C[2]*y+C[3]*x*x+C[4]*x*y+C[5]*y*y;}\n  fy(y){return this.YTOP-y;}\n  /* Landscape holds the handbook's framing — reserve left, Duffy Street right,\n     consistent with every other drawing in the set. Portrait turns the plan\n     north-up, because the block is 40 m by 21 m and would otherwise be a stamp\n     in the middle of a tall screen. Geometry keeps the handbook's baked\n     coordinates and is rotated by one group matrix; text is placed in the\n     rotated frame so it stays upright. */\n  rot(){ return this.state.orient==='portrait'; }\n  TX(x,y){ return this.rot()?this.YTOP-y-1:x; }\n  TY(x,y){ return this.rot()?46-x:this.fy(y); }\n  presetViews(){ return this.rot()\n    ? {all:{x:0,y:4.6,w:24,h:42.5},back:{x:0,y:23.5,w:24,h:23},front:{x:0,y:1.4,w:24,h:17}}\n    : {all:{x:-2,y:0.3,w:45,h:24.5},back:{x:-0.8,y:1.9,w:24,h:21.8},front:{x:24.5,y:1.9,w:20,h:21.8}}; }\n  baseItems(){\n    const D=this.D; let uid=1, items=[];\n    D.START.forEach(s=>{const i=this.mk(s[0],s[1],s[2],s[3],s[4],s[5],uid++); if(i)items.push(i);});\n    (D.STARTP||[]).forEach(s=>{const p=D.PLANTS.find(p=>p.id===s[0]); if(p){const i=this.mkPlant(p.n,s[1],s[2],uid++); if(i)items.push(i);}});\n    return {items,uid};\n  }\n  mk(name,x,y,w,h,rot,uid){\n    const l=this.LIBM[name]; if(!l) return null;\n    const c=HARDCOL[name]||['#dcd3c4','#82796a'];\n    const st=l[2]==='dig'?1:(l[2]==='pave'?2:3);\n    return {u:uid,t:'hard',n:name,shape:l[1],cat:l[2],x:x,y:y,w:w,h:h,rot:rot||0,cost:l[5],unit:l[6],fill:c[0],stroke:c[1],st:st};\n  }\n  mkPlant(name,x,y,uid){\n    const p=this.PL[name]; if(!p) return null;\n    return {u:uid,t:'plant',pn:name,n:DISP(p.n),shape:'circ',cat:'light',x:x,y:y,w:p.w/2,h:0,rot:0,cost:p.cost,unit:'item',\n      fill:PLANTCOL[p.g]||'#8fa073',stroke:'#56633f',g:p.g,ht:p.h,tender:p.tender,st:3};\n  }\n  /* ---------- solar ---------- */\n  sunpos(doy,hh){\n    const g=2*Math.PI/365*(doy-1+(hh-12)/24);\n    const eqt=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));\n    const dec=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);\n    const tst=hh*60+eqt+4*SITE.lon-60*SITE.tz, ha=(tst/4-180)*Math.PI/180, la=SITE.lat*Math.PI/180;\n    const alt=Math.asin(Math.sin(la)*Math.sin(dec)+Math.cos(la)*Math.cos(dec)*Math.cos(ha));\n    const az=Math.atan2(-Math.sin(ha)*Math.cos(dec),Math.cos(la)*Math.sin(dec)-Math.sin(la)*Math.cos(dec)*Math.cos(ha));\n    return {alt:alt*180/Math.PI,az:(az*180/Math.PI+360)%360};\n  }\n  trans(t,doy){ return t[6]>0?t[6]:((doy>=152&&doy<=259)?0.72:0.15); }\n  blockTop(b){ return b[6]+(b[5]-b[6])*0.5; }\n  sunlit(px,py,pz,alt,az,doy){\n    const D=this.D;\n    if(alt<=3) return 0;\n    const th=(SITE.nb-az)*Math.PI/180, ca=Math.cos(alt*Math.PI/180), sa=Math.sin(alt*Math.PI/180);\n    const dx=Math.cos(th)*ca, dy=Math.sin(th)*ca, dz=sa;\n    for(const f of D.FEN){\n      const ex=f[2]-f[0], ey=f[3]-f[1], nx=ey, ny=-ex, den=nx*dx+ny*dy;\n      if(Math.abs(den)<1e-9) continue;\n      const t=(nx*(f[0]-px)+ny*(f[1]-py))/den; if(t<=0.05||t>80) continue;\n      const X=px+dx*t, Y=py+dy*t, sp=((X-f[0])*ex+(Y-f[1])*ey)/(ex*ex+ey*ey);\n      if(sp<0||sp>1) continue;\n      if(pz+dz*t<this.RL(X,Y)+1.8) return 0;\n    }\n    const BX=D.BOXH.concat(D.NBR); let fr=1;\n    for(let t=0.3;t<60;t+=0.45){\n      const X=px+dx*t, Y=py+dy*t, Z=pz+dz*t;\n      for(const b of BX) if(X>=b[1]&&X<=b[3]&&Y>=b[2]&&Y<=b[4]&&Z<this.blockTop(b)) return 0;\n      for(const tr of D.STREE){ const ax=X-tr[1], ay=Y-tr[2];\n        if(ax*ax+ay*ay<=tr[3]*tr[3]&&Z>=tr[4]&&Z<=tr[5]){ fr*=this.trans(tr,doy); if(fr<0.05) return 0; } }\n    }\n    return fr;\n  }\n  sunHours(x,y,doy,ht){\n    const key=x.toFixed(1)+','+y.toFixed(1)+','+doy+','+(ht||0.9).toFixed(1);\n    if(this._sc&&this._sc[key]!=null) return this._sc[key];\n    const z=this.RL(x,y)+(ht||0.9); let h=0;\n    for(let t=5;t<=20.001;t+=0.3333){ const s=this.sunpos(doy,t); if(s.alt>3) h+=this.sunlit(x,y,z,s.alt,s.az,doy)*0.3333; }\n    this._sc=this._sc||{}; this._sc[key]=h; return h;\n  }\n  /* ---------- geometry ---------- */\n  corners(it){ if(it.shape==='circ') return null;\n    const cx=it.x+it.w/2, cy=it.y+it.h/2, a=(it.rot||0)*Math.PI/180, ca=Math.cos(a), sa=Math.sin(a);\n    return [[-it.w/2,-it.h/2],[it.w/2,-it.h/2],[it.w/2,it.h/2],[-it.w/2,it.h/2]].map(p=>[cx+p[0]*ca-p[1]*sa,cy+p[0]*sa+p[1]*ca]); }\n  centre(it){ return it.shape==='circ'?[it.x,it.y]:[it.x+it.w/2,it.y+it.h/2]; }\n  samples(it,n){ n=n||6; const o=[];\n    if(it.shape==='circ'){ o.push([it.x,it.y]);\n      for(let i=0;i<16;i++){const a=i/16*Math.PI*2;o.push([it.x+it.w*Math.cos(a),it.y+it.w*Math.sin(a)]);} return o; }\n    const cs=this.corners(it);\n    for(let i=0;i<=n;i++) for(let j=0;j<=n;j++){ const u=i/n,v=j/n;\n      const a=[cs[0][0]+(cs[1][0]-cs[0][0])*u,cs[0][1]+(cs[1][1]-cs[0][1])*u];\n      const b=[cs[3][0]+(c st px=this.TX(c[0],c[1]); let py=this.TY(c[0],c[1])+lh*0.35;\n        let gd=0; const wide=Math.max(1.2,it.n.length*mpp*6);\n        while(placed.some(q=>Math.abs(q.x-px)<(wide+q.w)/2&&Math.abs(q.y-py)<lh)&&gd<12){py+=lh;gd++;}\n        placed.push({x:px,y:py,w:wide});\n        tx+='<text x=\"'+px.toFixed(2)+'\" y=\"'+py.toFixed(2)+'\" font-size=\"'+F(11)+'\" text-anchor=\"middle\" fill=\"#474238\" paint-order=\"stroke\" stroke=\"'+COL.paper+'\" stroke-width=\"'+F(3.2)+'\" stroke-linejoin=\"round\">'+it.n.replace(/&/g,'&amp;').replace(/<\u002Fg,'&lt;')+'<\u002Ftext>';\n      }\n    }\n    tx+=D.TREES.map(t=>'<text x=\"'+this.TX(t.x,t.y).toFixed(2)+'\" y=\"'+(this.TY(t.x,t.y)+5*mpp).toFixed(2)+'\" font-size=\"'+F(13)+'\" font-weight=\"600\" text-anchor=\"middle\" fill=\"#fff\" pointer-events=\"none\">'+t.id+'<\u002Ftext>').join('');\n    if(this.rot()){\n      tx+='<text x=\"'+(v.x+v.w/2)+'\" y=\"'+(v.y+18*mpp)+'\" font-size=\"'+F(12)+'\" text-anchor=\"middle\" fill=\"#82796a\">Duffy Street ↑ north-north-west<\u002Ftext>';\n      tx+='<text x=\"'+(v.x+v.w/2)+'\" y=\"'+(v.y+v.h-10*mpp)+'\" font-size=\"'+F(12)+'\" text-anchor=\"middle\" fill=\"#82796a\">Mount Ainslie reserve ↓ south-south-east<\u002Ftext>';\n    } else {\n      tx+='<text x=\"'+(v.x+14*mpp)+'\" y=\"'+(v.y+v.h-12*mpp)+'\" font-size=\"'+F(12)+'\" fill=\"#82796a\">← Mount Ainslie reserve, south-south-east<\u002Ftext>';\n      tx+='<text x=\"'+(v.x+v.w-14*mpp)+'\" y=\"'+(v.y+v.h-12*mpp)+'\" font-size=\"'+F(12)+'\" text-anchor=\"end\" fill=\"#82796a\">Duffy Street, north-north-west →<\u002Ftext>';\n    }\n    el.innerHTML='<svg width=\"100%\" height=\"100%\" viewBox=\"'+v.x+' '+v.y+' '+v.w+' '+v.h+'\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block\">'\n      +'<rect x=\"'+(v.x-5)+'\" y=\"'+(v.y-5)+'\" width=\"'+(v.w+10)+'\" height=\"'+(v.h+10)+'\" fill=\"'+COL.paper+'\"/>'\n      +(this.rot()?'<g transform=\"matrix(0 -1 1 0 -1 46)\">'+g+'<\u002Fg>':g)+tx+'<\u002Fsvg>';\n  }\n  /* ---------- derived ---------- */\n  quantities(){ let pave=0,soft=0,lin=0,plants=0,cost=0,mulch=0; const byg={};\n    for(const it of this.state.items){ const a=this.area(it);\n      if(it.t==='plant'){plants++;cost+=it.cost;byg[it.g]=(byg[it.g]||0)+1;}\n      else if(it.unit==='m2'){ if(it.cat==='soft'){soft+=a; if(it.n.indexOf('Mulch')>=0)mulch+=a*0.1;} else pave+=a; cost+=a*it.cost; }\n      else if(it.unit==='lin'){ const L=Math.max(it.w,it.h); lin+=L; cost+=L*it.cost; }\n      else cost+=it.cost; }\n    return {pave,soft,lin,plants,cost,mulch,byg}; }\n  issues(){\n    const s=this.state, out=[];\n    for(const it of s.items){\n      const ck=this.checks(it), digs=(it.cat==='dig'||it.cat==='pave');\n      if(ck.lvl==='r') out.push({sev:'stop',u:it.u,title:it.n,body:ck.msg});\n      else if(ck.lvl==='a'&&digs) out.push({sev:'care',u:it.u,title:it.n,body:ck.msg});\n      if(it.cat==='dig'||it.cat==='pave'){ const cf=this.cutfill(it);\n        if(cf.maxCut>0.5||cf.maxFill>0.4) out.push({sev:'stop',u:it.u,title:it.n+' — cut and fill',\n          body:'Levelling it needs '+(cf.maxCut*1000).toFixed(0)+' mm of cut and '+(cf.maxFill*1000).toFixed(0)+' mm of fill. Over the 500 mm cut or 400 mm fill limit, which triggers a site reclassification.'}); }\n      if(it.t==='plant'&&it.tender) out.push({sev:'care',u:it.u,title:it.n,body:'Frost tender in Canberra. It will need a warm wall, a pot that can move, or replacing with something hardy.'});\n      if(it.t==='plant'&&ck.out) out.push({sev:'care',u:it.u,title:it.n+' overhangs the boundary',body:'Its mature canopy crosses the line. Fine if you are happy to prune it, worth knowing before it is in the ground.'});\n      if(it.n==='Sunken firepit'){ const d=it.x-it.w;\n        if(d<3) out.push({sev:'stop',u:it.u,title:'Firepit is '+d.toFixed(1)+' m from the reserve',\n          body:'The ACT rule is three metres of clearance on the reserve side. Moving it about '+Math.max(0.5,3-d).toFixed(1)+' m toward the street fixes that, but pushes it toward the gum\\u2019s protection zone.'}); }\n      const inCorridor=this.samples(it,4).some(p=>p[1]>=0.5&&p[1]<=3.0);\n      if(inCorridor&&(digs||it.n.indexOf('lawn')>=0)) out.push({sev:'care',u:it.u,title:it.n+' sits on the overland flow path',\n        body:'The corridor along the side boundary between y 0.5 and 3.0 m is the route water takes if the reserve bank overtops. Anything here needs a formed route around it along the fence — a drainage change, not yet priced.'});\n    }\n    const q=this.quantities();\n    if(q.cost>BUDGET) out.push({sev:'care',title:'Over the ten thousand',body:'The layout as drawn is $'+Math.round(q.cost).toLocaleString()+', which is $'+Math.round(q.cost-BUDGET).toLocaleString()+' past the budget. Staging it is the answer, not cutting it.'});\n    (this.state.todos||[]).forEach((t,i)=>out.push({sev:'note',title:'From a conversation',body:t}));\n    const order={stop:0,care:1,note:2};\n    return out.sort((a,b)=>order[a.sev]-order[b.sev]);\n  }\n  /* ---------- ask ---------- */\n  factSheet(){\n    const q=this.quantities(), iss=this.issues();\n    const items=this.state.items.map(i=>i.n+' at ('+i.x.toFixed(1)+','+i.y.toFixed(1)+')'+(i.t==='plant'?'':' '+i.w.toFixed(1)+'x'+i.h.toFixed(1)+'m')).join('; ');\n    return ['SITE 234 Duffy Street, Ainslie ACT. Block 14 Section 105, 807 m2, backs onto Mount Ainslie reserve.',\n    'Orientation: Duffy Street is north-north-west, the reserve south-south-east. Local frame: +x runs from the reserve toward the street, +y west-south-west. x=0 is the rear (reserve) boundary.',\n    'The block falls 2.08 m from the reserve to the street at about 1 in 19, so all water moves one way, toward the house then the street.',\n    'Tree protection zones cover 52% of the open back garden (167 of 320 m2); only 154 m2 is free to re-grade, in a 4 m strip along the east-north-east boundary, a pocket at the west-south-west rear corner and a 4 m band next to the house.',\n    'Soil: 100 mm of loose silty sand over clayey sand and sandy clay, refusal at 1.0-1.1 m; free-draining sand where she gardens, reactive clay where the house sits. Class P site because of the trees; the 20-40 mm movement figure assumes the pear stays.',\n    'The walking path behind the rear fence sits on a raised man-made bank that holds hillside water back. It protects the block most of the time but concentrates risk into a rarer, larger event. The overland flow corridor along the side boundary (y 0.5-3.0) must stay clear and continuous to the street; capacity 236 L/s.',\n    'Trees: 1 brittle gum (trunk 1.97 m from the rear boundary, structural root zone crosses it, so no channel can follow that boundary past it), 2 Manchurian pear (RETAIN, hand excavation approved), 3 liquidambar, 4 and 5 velvet ash street trees (public).',\n    'Sun hours [21 Dec, 21 Sep, 21 Jun]: rear pocket 7.4/7.3/4.5, east-north-east side strip 8.1/6.5/4.0, paved terrace 11.0/3.9/0.0, under trees 1 and 2 2.9/1.9/1.4, back garden average 5.8/4.4/2.2, front garden average 4.3/3.4/2.3, courtyard 5.7/3.1/0.0.',\n    'Drainage: DN150 spine at 1 in 19, capacity 45.2 L/s against 5.32 design flow; DN100 north line sleeved under the garage; corner swale is the only stretch of rear boundary outside the gum protection zone.',\n    'Cut over 500 mm or fill over 400 mm triggers a site reclassification.',\n    'The block is inside the ACT mapped bushfire prone area. Bushfire construction compliance is already dealt with and the certifier is satisfied; do not reopen it. Landscape only: the ACT rule is three metres clearance to the reserve for a firepit.',\n    'Budget about $10,000 over 6-12 months, staged, her own labour, hand-dug. A contractor does the stormwater.',\n    'Decisions made: keep the pear; no pond (snakes); the area off the house is paved with an outdoor kitchen, not a deck; lawn beats vegetables (toddler); vegetables become planters on the paving; natives only from here; front garden gets mounds and two fruit trees only, quince a
